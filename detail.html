<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Data</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            prim: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d' },
            sec:'#0ea5e9', warn:'#f59e0b', danger:'#ef4444'
          }
        }
      }
    }
  </script>
  <style>
    .gradient-bg { background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%); }
  </style>
</head>
<body class="bg-prim-50">
  <nav class="gradient-bg text-white py-3 px-4 flex items-center gap-3 shadow-lg">
    <a href="index.html" class="text-xl"><i class="fa-solid fa-arrow-left"></i></a>
    <h1 class="text-lg font-bold">Detail Data</h1>
  </nav>

  <main class="max-w-lg mx-auto p-4" data-aos="fade-up">
    <div class="bg-white rounded-2xl shadow-lg p-6 space-y-4">
      <div>
        <label class="text-sm text-gray-500">Nama</label>
        <input type="text" id="nama" class="w-full p-3 border rounded-lg mt-1" />
      </div>
      <div>
        <label class="text-sm text-gray-500">Alamat</label>
        <textarea id="alamat" class="w-full p-3 border rounded-lg mt-1" rows="3"></textarea>
      </div>
      <div>
        <label class="text-sm text-gray-500">Status</label>
        <select id="status" class="w-full p-3 border rounded-lg mt-1">
          <option value="belum">Belum Diambil</option>
          <option value="sudah">Sudah Diambil</option>
          <option value="none">Tidak Ambil</option>
        </select>
      </div>
      <div class="flex gap-3 pt-4">
        <button onclick="goBack()" class="flex-1 py-2 border rounded-lg">Kembali</button>
        <button onclick="simpan()" class="flex-1 py-2 gradient-bg text-white rounded-lg">Simpan</button>
      </div>
      <button onclick="hapus()" class="w-full py-2 bg-red-50 text-red-600 rounded-lg mt-2">
        <i class="fa-solid fa-trash mr-2"></i>Hapus Data Ini
      </button>
    </div>
  </main>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyDLbQll8Mz80vhvflGUjOF8s5UaVFjrZy-Q8_zhj__QSpVRrc5xhOW4ZN75LB5EeMV/exec"; // SAMA DENGAN DI INDEX
    const id = new URLSearchParams(location.search).get('id');
    let dataLama = null;

    document.addEventListener('DOMContentLoaded', () => {
      AOS.init({ duration: 600 });
      if (!id) return alert('ID tidak ditemukan'), location.href='index.html';
      muatData();
    });

    async function muatData() {
      const res = await fetch(GAS_URL, {
        method:'POST',
        body:JSON.stringify({ aksi:'detail', id })
      }).then(r=>r.json());
      if (!res.data) return alert('Data tidak ditemukan'), location.href='index.html';
      dataLama = res.data;
      document.getElementById('nama').value = res.data.nama||'';
      document.getElementById('alamat').value = res.data.alamat||'';
      document.getElementById('status').value = res.data.status||'belum';
    }

    async function simpan() {
      await fetch(GAS_URL, {
        method:'POST',
        body:JSON.stringify({
          aksi:'simpan',
          id,
          nama: document.getElementById('nama').value.trim(),
          alamat: document.getElementById('alamat').value.trim(),
          status: document.getElementById('status').value
        })
      });
      alert('Data tersimpan!');
      location.href='index.html';
    }

    async function hapus() {
      if(confirm('Yakin hapus?')) {
        await fetch(GAS_URL, { method:'POST', body:JSON.stringify({ aksi:'hapus', id }) });
        location.href='index.html';
      }
    }

    function goBack() {
      location.href='index.html';
    }
  </script>
</body>
</html>
