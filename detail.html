<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Data</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            prim: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d' },
            sec:'#0ea5e9', warn:'#f59e0b', danger:'#ef4444'
          }
        }
      }
    }
  </script>
  <style>
    .gradient-bg { background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%); }
      .card-shadow {
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
      }
      .hover-lift {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .hover-lift:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      }
      /* === ANIMASI LOADING BARU === */
      .loading-spin {
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .tombol-sedang-memuat {
        opacity: 0.6;
        pointer-events: none;
        position: relative;
      }
  </style>
</head>
<body class="bg-prim-50">
  <nav class="gradient-bg text-white py-3 px-4 flex items-center gap-3 shadow-lg">
    <a href="index.html" class="text-xl"><i class="fa-solid fa-arrow-left"></i></a>
    <h1 class="text-lg font-bold">Detail Data</h1>
  </nav>

  <main class="max-w-lg mx-auto p-4" data-aos="fade-up">
      <!-- === INDIKATOR LOADING === -->
  <div id="loadingOverlay" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-2xl p-6 shadow-2xl flex flex-col items-center gap-3">
      <i class="fa-solid fa-circle-notch text-3xl text-prim-600 loading-spin"></i>
      <span class="text-gray-700 font-medium">Sedang memproses...</span>
    </div>
  </div>

    <div id="tandaiBanner" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 mb-4 text-sm">
      <i class="fa-solid fa-triangle-exclamation mr-1"></i>
      <span id="tandaiTeks"></span>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6 space-y-4">
      <div>
        <label class="text-sm text-gray-500">Nama</label>
        <input type="text" id="nama" class="w-full p-3 border rounded-lg mt-1" />
      </div>
      <div>
        <label class="text-sm text-gray-500">Alamat</label>
        <input type="text" id="alamat" class="w-full p-3 border rounded-lg mt-1" />
      </div>
      <div>
        <label class="text-sm text-gray-500">Jenis</label>
        <select id="jenis" class="w-full p-3 border rounded-lg mt-1">
          <option value="Umum">Umum</option>
          <option value="Salikin">Salikin</option>
          <option value="Salikah">Salikah</option>
        </select>
      </div>
      <div>
        <label class="text-sm text-gray-500">Status</label>
        <select id="status" class="w-full p-3 border rounded-lg mt-1">
          <option value="belum">Belum Diambil</option>
          <option value="sudah">Sudah Diambil</option>
          <option value="none">Tidak Ambil</option>
        </select>
      </div>

      <!-- Tampilan QR Code -->
      <div class="border-t pt-4 mt-4 text-center">
        <h3 class="font-semibold text-gray-700 mb-2">Kode QR Data Ini</h3>
        <div id="qrcode" class="flex justify-center"></div>
        <p class="text-xs text-gray-500 mt-2">Pindai untuk membuka halaman detail ini</p>
      </div>

      <div class="flex gap-3 pt-4">
        <button onclick="goBack()" class="flex-1 py-2 border rounded-lg">Kembali</button>
        <button id="btnSimpan" onclick="simpan()" class="flex-1 py-2 gradient-bg text-white rounded-lg">Simpan Perubahan</button>
      </div>
      <button id="btnTandai" onclick="tandai()" class="hidden w-full py-2 bg-warn/10 text-warn font-medium rounded-lg mt-2">
        <i class="fa-solid fa-flag mr-2"></i>Tandai Kesalahan Input
      </button>
      <button id="btnBersihkanTanda" onclick="bersihkanTanda()" class="hidden w-full py-2 bg-gray-100 text-gray-600 rounded-lg mt-2">
        <i class="fa-solid fa-eraser mr-2"></i>Bersihkan Tanda
      </button>
      <button id="btnHapus" onclick="hapus()" class="hidden w-full py-2 bg-red-50 text-red-600 rounded-lg mt-2">
        <i class="fa-solid fa-trash mr-2"></i>Hapus Data Ini
      </button>
    </div>
  </main>

  <script>
    // === FUNGSI TAMPIL/SEMBUNYIKAN LOADING ===
    function tampilkanLoading() {
      document.getElementById('loadingOverlay').classList.remove('hidden');
    }
    function sembunyikanLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }
    // === GANTI DENGAN URL DEPLOYMENT-MU ===
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzW5OJoQVZ-mJmQ0dC7Wvsg49BY6itH8niXebutRFFPqwU9PDAb9RJyeWeMIcWBg7uF/exec";
    const SITE_URL = window.location.href.split('?')[0];
    const CACHE_KEY = 'pasDataCache';
    const id = new URLSearchParams(location.search).get('id');
    const peran = localStorage.getItem('role') || 'user';
    let dataLama = null;

    async function panggilAPI(payload) {
      const body = Object.assign({
        user: localStorage.getItem('user') || '',
        userPass: localStorage.getItem('sandiHash') || ''
      }, payload);
      return fetch(GAS_URL, { method: 'POST', body: JSON.stringify(body) }).then(r => r.json());
    }
    function bacaCacheLokal() {
      try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); } catch (e) { return []; }
    }
    function simpanCacheLokal(data) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      AOS.init({ duration: 600 });
      if (!localStorage.getItem('user')) { location.href = 'index.html'; return; }
      if (!id) { alert('ID tidak ditemukan'); location.href = 'index.html'; return; }
      terapkanPeran();
      muatData();
    });

    // Terapkan batasan tampilan sesuai peran: user hanya lihat, subAdmin tak bisa hapus, admin akses penuh
    function terapkanPeran() {
      const hanyaLihat = peran === 'user';
      ['nama', 'alamat', 'jenis', 'status'].forEach(fid => {
        document.getElementById(fid).disabled = hanyaLihat;
      });
      document.getElementById('btnSimpan').classList.toggle('hidden', hanyaLihat);
      document.getElementById('btnHapus').classList.toggle('hidden', peran !== 'admin');
      document.getElementById('btnTandai').classList.toggle('hidden', !(peran === 'admin' || peran === 'subAdmin'));
    }

    function tampilkanTanda(catatan) {
      const ada = !!catatan;
      document.getElementById('tandaiBanner').classList.toggle('hidden', !ada);
      document.getElementById('tandaiTeks').textContent = ada ? ('Ditandai bermasalah: ' + catatan) : '';
      document.getElementById('btnBersihkanTanda').classList.toggle('hidden', !(ada && (peran === 'admin' || peran === 'subAdmin')));
      document.getElementById('btnTandai').textContent = ada ? 'Ubah Tanda Kesalahan' : 'Tandai Kesalahan Input';
    }

    // Tampilkan cache lokal dulu (instan) kalau ada, lalu sinkron ke Google Sheets di belakang layar
    async function muatData() {
      const cache = bacaCacheLokal();
      const dariCache = cache.find(d => d.id === id);
      if (dariCache) {
        isiForm(dariCache);
      } else {
        tampilkanLoading();
      }

      try {
        const res = await panggilAPI({ aksi: 'detail', id });
        if (res.ok && res.data) {
          isiForm(res.data);
          // Perbarui juga cache daftar data supaya konsisten dengan index.html
          const idx = cache.findIndex(d => d.id === id);
          if (idx > -1) cache[idx] = Object.assign({}, cache[idx], res.data);
          else cache.push(res.data);
          simpanCacheLokal(cache);
        } else if (!dariCache) {
          alert(res.msg || 'Data tidak ditemukan');
          location.href = 'index.html';
          return;
        }
      } catch (e) {
        // Offline / Sheets lambat — tetap pakai data dari cache lokal
      }
      sembunyikanLoading();
    }

    function isiForm(data) {
      dataLama = data;
      document.getElementById('nama').value = data.nama || '';
      document.getElementById('alamat').value = data.alamat || '';
      document.getElementById('jenis').value = data.jenis || 'Umum';
      document.getElementById('status').value = data.status || 'belum';
      tampilkanTanda(data.ditandai || '');
      document.getElementById('qrcode').innerHTML = '';
      new QRCode(document.getElementById('qrcode'), {
        text: SITE_URL + '?id=' + id,
        width: 200,
        height: 200
      });
    }

    // Simpan lokal dulu (instan) → kirim ke Google Sheets di belakang layar
    function simpan() {
      const data = {
        id,
        nama: document.getElementById('nama').value.trim(),
        alamat: document.getElementById('alamat').value.trim(),
        jenis: document.getElementById('jenis').value,
        status: document.getElementById('status').value
      };
      const cache = bacaCacheLokal();
      const idx = cache.findIndex(d => d.id === id);
      const gabung = Object.assign({}, idx > -1 ? cache[idx] : {}, data);
      if (idx > -1) cache[idx] = gabung; else cache.push(gabung);
      simpanCacheLokal(cache);

      panggilAPI(Object.assign({ aksi: 'simpan' }, data)).then(res => {
        if (!res.ok) alert('Gagal sinkron ke Google Sheets: ' + (res.msg || ''));
      }).catch(() => {});
      location.href = 'index.html';
    }

    // Hanya admin — hapus lokal dulu (instan) → kirim ke Google Sheets di belakang layar
    function hapus() {
      if (!confirm('Yakin ingin menghapus data ini? Tindakan ini tidak dapat dibatalkan!')) return;
      const cache = bacaCacheLokal().filter(d => d.id !== id);
      simpanCacheLokal(cache);
      panggilAPI({ aksi: 'hapus', id }).catch(() => {});
      location.href = 'index.html';
    }

    // subAdmin/admin — tandai kesalahan input tanpa menghapus data
    function tandai() {
      const catatan = prompt('Tuliskan catatan kesalahan pada data ini:', dataLama && dataLama.ditandai || '');
      if (catatan === null) return;
      const cache = bacaCacheLokal();
      const idx = cache.findIndex(d => d.id === id);
      if (idx > -1) { cache[idx].ditandai = catatan; simpanCacheLokal(cache); }
      tampilkanTanda(catatan);
      panggilAPI({ aksi: 'tandai', id, catatan }).catch(() => {});
    }

    function bersihkanTanda() {
      const cache = bacaCacheLokal();
      const idx = cache.findIndex(d => d.id === id);
      if (idx > -1) { cache[idx].ditandai = ''; simpanCacheLokal(cache); }
      tampilkanTanda('');
      panggilAPI({ aksi: 'tandai', id, catatan: '' }).catch(() => {});
    }

    function goBack() {
      location.href = 'index.html';
    }
  </script>
</body>
</html>
