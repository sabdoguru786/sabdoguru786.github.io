<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Data</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            prim: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d' },
            sec:'#0ea5e9', warn:'#f59e0b', danger:'#ef4444'
          }
        }
      }
    }
  </script>
  <style>
    .gradient-bg { background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%); }
      .card-shadow {
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
      }
      .hover-lift {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .hover-lift:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      }
      /* === ANIMASI LOADING BARU === */
      .loading-spin {
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .tombol-sedang-memuat {
        opacity: 0.6;
        pointer-events: none;
        position: relative;
      }
      /* Class ini ditambah lewat JS (bukan statis di HTML), jadi harus ditulis manual —
         Tailwind CDN cuma compile class yang ada di markup saat halaman dimuat */
      #ikonQR.rotate-180, #ikonEdit.rotate-180 {
        transform: rotate(180deg);
      }
      .tombol-status {
        transition: background-color 0.2s ease, color 0.2s ease;
      }
  </style>
</head>
<body class="bg-prim-50">
  <nav class="gradient-bg text-white py-3 px-4 flex items-center gap-3 shadow-lg">
    <a href="index.html" class="text-xl"><i class="fa-solid fa-arrow-left"></i></a>
    <h1 class="text-lg font-bold">Detail Data</h1>
  </nav>

  <main class="max-w-lg mx-auto p-4" data-aos="fade-up">
      <!-- === INDIKATOR LOADING === -->
  <div id="loadingOverlay" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-2xl p-6 shadow-2xl flex flex-col items-center gap-3">
      <i class="fa-solid fa-circle-notch text-3xl text-prim-600 loading-spin"></i>
      <span class="text-gray-700 font-medium">Sedang memproses...</span>
    </div>
  </div>

    <div id="tandaiBanner" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 mb-4 text-sm">
      <i class="fa-solid fa-triangle-exclamation mr-1"></i>
      <span id="tandaiTeks"></span>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
      <!-- Foto — persegi panjang ke bawah (rasio potret ~3:4), bukan bulat -->
      <div id="avatarLingkaran" class="w-36 h-48 sm:w-40 sm:h-52 rounded-xl mx-auto mb-4 overflow-hidden flex items-center justify-center text-white text-5xl font-bold">
        <span id="avatarHuruf">?</span>
        <img id="fotoTampil" class="hidden w-full h-full object-cover" alt="Foto" />
      </div>
      <h2 id="tampilNama" class="text-xl font-bold text-gray-800">-</h2>
      <p id="tampilAlamat" class="text-gray-500 text-sm mt-1">-</p>
      <span id="tampilJenis" class="inline-block mt-3 px-3 py-1 rounded-full text-xs font-medium">Umum</span>

      <!-- Status sebagai tombol pilihan -->
      <div class="mt-6">
        <p class="text-xs text-gray-400 mb-2">Status Pengambilan</p>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" data-nilai="belum" onclick="pilihStatus('belum')" class="tombol-status py-2 rounded-lg text-sm font-semibold border border-gray-300 bg-white text-gray-600">Belum</button>
          <button type="button" data-nilai="sudah" onclick="pilihStatus('sudah')" class="tombol-status py-2 rounded-lg text-sm font-semibold border border-gray-300 bg-white text-gray-600">Sudah</button>
          <button type="button" data-nilai="none" onclick="pilihStatus('none')" class="tombol-status py-2 rounded-lg text-sm font-semibold border border-gray-300 bg-white text-gray-600">Tidak</button>
        </div>
      </div>

      <!-- Tombol Edit & Hapus — sejajar -->
      <div class="grid grid-cols-2 gap-3 mt-6">
        <button id="btnEdit" type="button" onclick="toggleEdit()" class="py-2 rounded-lg text-sm font-semibold border border-prim-300 text-prim-700 hover:bg-prim-50 flex items-center justify-center gap-1">
          <i id="ikonEdit" class="fa-solid fa-chevron-down transition-transform"></i>Edit
        </button>
        <button id="btnHapus" onclick="hapus()" class="hidden py-2 rounded-lg text-sm font-semibold bg-red-50 text-red-600 hover:bg-red-100">
          <i class="fa-solid fa-trash mr-1"></i>Hapus
        </button>
      </div>

      <!-- Form Edit — slidedown -->
      <div id="formEditWrap" class="overflow-hidden transition-all duration-300 text-left" style="max-height: 0;">
        <div class="pt-4 mt-3 border-t space-y-3">
          <div>
            <label class="text-sm text-gray-500">Foto</label>
            <div class="flex items-center gap-3 mt-1">
              <div class="w-14 rounded-lg overflow-hidden bg-gray-100 flex items-center justify-center text-gray-400 flex-shrink-0" style="height: 4.5rem;">
                <img id="previewFotoImg" class="hidden w-full h-full object-cover" alt="Pratinjau" />
                <i id="previewFotoIkon" class="fa-solid fa-image"></i>
              </div>
              <input type="file" id="fFoto" accept="image/*" onchange="pratinjauFoto()" class="text-sm flex-1" />
            </div>
          </div>
          <div>
            <label class="text-sm text-gray-500">Nama</label>
            <input type="text" id="nama" class="w-full p-3 border rounded-lg mt-1" />
          </div>
          <div>
            <label class="text-sm text-gray-500">Alamat</label>
            <input type="text" id="alamat" class="w-full p-3 border rounded-lg mt-1" />
          </div>
          <div>
            <label class="text-sm text-gray-500">Jama'ah</label>
            <select id="jenis" class="w-full p-3 border rounded-lg mt-1">
              <option value="Umum">Umum</option>
              <option value="Salikin">Salikin</option>
              <option value="Salikah">Salikah</option>
            </select>
          </div>
          <button id="btnSimpan" onclick="simpan()" class="w-full py-2 gradient-bg text-white rounded-lg">Simpan</button>
        </div>
      </div>

      <!-- Kode QR — disembunyikan, buka lewat link (slidedown) -->
      <div class="border-t pt-4 mt-6 text-center">
        <button type="button" onclick="toggleQR()" class="text-sm text-prim-700 font-medium hover:underline">
          <i id="ikonQR" class="fa-solid fa-chevron-down mr-1 transition-transform"></i>Tampilkan Kode QR
        </button>
        <div id="qrWrap" class="overflow-hidden transition-all duration-300" style="max-height: 0;">
          <div class="pt-3">
            <div id="qrcode" class="flex justify-center"></div>
            <p class="text-xs text-gray-500 mt-2">Pindai untuk membuka halaman detail ini</p>
          </div>
        </div>
      </div>

      <div class="flex gap-3 pt-5">
        <button onclick="goBack()" class="flex-1 py-2 border rounded-lg">Kembali</button>
      </div>
      <button id="btnTandai" onclick="tandai()" class="hidden w-full py-2 bg-warn/10 text-warn font-medium rounded-lg mt-2">
        <i class="fa-solid fa-flag mr-2"></i>Tandai Kesalahan Input
      </button>
      <button id="btnBersihkanTanda" onclick="bersihkanTanda()" class="hidden w-full py-2 bg-gray-100 text-gray-600 rounded-lg mt-2">
        <i class="fa-solid fa-eraser mr-2"></i>Bersihkan Tanda
      </button>
    </div>
  </main>

  <!-- Modal Konfirmasi (pengganti confirm() bawaan browser) -->
  <div id="konfirmModal" class="hidden fixed inset-0 z-[70] flex items-center justify-center bg-black/50 p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
      <div class="w-14 h-14 bg-warn/10 text-warn rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <p id="konfirmPesan" class="text-gray-700 mb-6"></p>
      <div class="flex gap-3">
        <button id="konfirmBatal" class="flex-1 py-2 border rounded-lg">Batal</button>
        <button id="konfirmYa" class="flex-1 py-2 bg-red-500 text-white rounded-lg font-medium">Ya, Lanjutkan</button>
      </div>
    </div>
  </div>

  <script>
    // === MODAL KONFIRMASI (pengganti confirm() bawaan browser) ===
    function konfirmasi(pesan, labelYa) {
      return new Promise((resolve) => {
        document.getElementById('konfirmPesan').textContent = pesan;
        document.getElementById('konfirmYa').textContent = labelYa || 'Ya, Lanjutkan';
        document.getElementById('konfirmModal').classList.remove('hidden');
        const tombolYa = document.getElementById('konfirmYa');
        const tombolBatal = document.getElementById('konfirmBatal');
        function bersihkan(hasil) {
          document.getElementById('konfirmModal').classList.add('hidden');
          tombolYa.removeEventListener('click', onYa);
          tombolBatal.removeEventListener('click', onBatal);
          resolve(hasil);
        }
        function onYa() { bersihkan(true); }
        function onBatal() { bersihkan(false); }
        tombolYa.addEventListener('click', onYa);
        tombolBatal.addEventListener('click', onBatal);
      });
    }

    // === FUNGSI TAMPIL/SEMBUNYIKAN LOADING ===
    function tampilkanLoading() {
      document.getElementById('loadingOverlay').classList.remove('hidden');
    }
    function sembunyikanLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }
    // === GANTI DENGAN URL DEPLOYMENT-MU ===
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzW5OJoQVZ-mJmQ0dC7Wvsg49BY6itH8niXebutRFFPqwU9PDAb9RJyeWeMIcWBg7uF/exec";
    const SITE_URL = window.location.href.split('?')[0];
    const CACHE_KEY = 'pasDataCache';
    const id = new URLSearchParams(location.search).get('id');
    const peran = localStorage.getItem('role') || 'user';
    let dataLama = null;

    // Warna per jenis jama'ah — dipakai lewat inline style (bukan class Tailwind dinamis),
    // karena Tailwind CDN cuma compile class yang tertulis statis di HTML saat halaman dimuat.
    const WARNA_JENIS = {
      Umum: { lembut: '#e0f2fe', teks: '#0369a1', solid: '#0ea5e9' },
      Salikin: { lembut: '#fae8ff', teks: '#a21caf', solid: '#d946ef' },
      Salikah: { lembut: '#fce7f3', teks: '#be185d', solid: '#ec4899' }
    };

    async function panggilAPI(payload) {
      const body = Object.assign({
        user: localStorage.getItem('user') || '',
        userPass: localStorage.getItem('sandiHash') || ''
      }, payload);
      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(body) });
        return await res.json();
      } catch (e) {
        return { ok: false, msg: 'Tidak bisa terhubung ke server (cek URL Apps Script/koneksi internet)' };
      }
    }

    // Normalisasi URL foto Drive — link lama format "uc?export=view&id=..." kadang gagal
    // tampil kalau dipasang di <img> lintas-situs. Ambil ID file-nya lalu pakai domain
    // lh3.googleusercontent.com yang terbukti selalu langsung mengembalikan gambar.
    function urlFotoAman(url) {
      if (!url) return '';
      const cocok = url.match(/[?&]id=([^&]+)/) || url.match(/\/d\/([^/?]+)/);
      return cocok ? `https://lh3.googleusercontent.com/d/${cocok[1]}` : url;
    }

    function bacaCacheLokal() {
      try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); } catch (e) { return []; }
    }
    function simpanCacheLokal(data) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
    }

    // === UPLOAD FOTO ORANG KE GOOGLE DRIVE ===
    function bacaFileSebagaiBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    async function uploadFotoKeDrive(file) {
      if (file.size > 8 * 1024 * 1024) {
        alert('Ukuran foto maksimal 8MB');
        return null;
      }
      const base64 = await bacaFileSebagaiBase64(file);
      const res = await panggilAPI({ aksi: 'uploadFoto', base64, mime: file.type, namaFile: file.name });
      if (!res.ok) { alert('Gagal unggah foto: ' + (res.msg || '')); return null; }
      return res; // { ok, url, fileId }
    }
    // Pratinjau langsung di form begitu file dipilih (sebelum benar-benar diupload saat Simpan)
    function pratinjauFoto() {
      const file = document.getElementById('fFoto').files[0];
      if (!file) return;
      const gambar = document.getElementById('previewFotoImg');
      const ikon = document.getElementById('previewFotoIkon');
      const reader = new FileReader();
      reader.onload = () => {
        gambar.src = reader.result;
        gambar.classList.remove('hidden');
        ikon.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }

    document.addEventListener('DOMContentLoaded', () => {
      AOS.init({ duration: 600 });
      if (!localStorage.getItem('user')) { location.href = 'index.html'; return; }
      if (!id) { alert('ID tidak ditemukan'); location.href = 'index.html'; return; }
      terapkanPeran();
      muatData();
    });

    // Terapkan batasan tampilan sesuai peran: user hanya lihat, subAdmin tak bisa hapus, admin akses penuh
    function terapkanPeran() {
      const hanyaLihat = peran === 'user';
      document.getElementById('btnEdit').classList.toggle('hidden', hanyaLihat);
      document.querySelectorAll('.tombol-status').forEach((btn) => {
        btn.disabled = hanyaLihat;
        btn.style.opacity = hanyaLihat ? '0.5' : '';
        btn.style.cursor = hanyaLihat ? 'not-allowed' : '';
      });
      document.getElementById('btnHapus').classList.toggle('hidden', peran !== 'admin');
      document.getElementById('btnTandai').classList.toggle('hidden', !(peran === 'admin' || peran === 'subAdmin'));
    }

    function tampilkanTanda(catatan) {
      const ada = !!catatan;
      document.getElementById('tandaiBanner').classList.toggle('hidden', !ada);
      document.getElementById('tandaiTeks').textContent = ada ? ('Ditandai bermasalah: ' + catatan) : '';
      document.getElementById('btnBersihkanTanda').classList.toggle('hidden', !(ada && (peran === 'admin' || peran === 'subAdmin')));
      document.getElementById('btnTandai').textContent = ada ? 'Ubah Tanda Kesalahan' : 'Tandai Kesalahan Input';
    }

    // Tampilkan cache lokal dulu (instan) kalau ada, lalu sinkron ke Google Sheets di belakang layar
    async function muatData() {
      const cache = bacaCacheLokal();
      const dariCache = cache.find(d => d.id === id);
      if (dariCache) {
        isiTampilan(dariCache);
      } else {
        tampilkanLoading();
      }

      try {
        const res = await panggilAPI({ aksi: 'detail', id });
        if (res.ok && res.data) {
          isiTampilan(res.data);
          // Perbarui juga cache daftar data supaya konsisten dengan index.html
          const idx = cache.findIndex(d => d.id === id);
          if (idx > -1) cache[idx] = Object.assign({}, cache[idx], res.data);
          else cache.push(res.data);
          simpanCacheLokal(cache);
        } else if (!dariCache) {
          alert(res.msg || 'Data tidak ditemukan');
          location.href = 'index.html';
          return;
        }
      } catch (e) {
        // Offline / Sheets lambat — tetap pakai data dari cache lokal
      }
      sembunyikanLoading();
    }

    // Slidedown/slideup generik (dipakai untuk panel Edit & Kode QR)
    function slidePanel(wrapId, ikonId, buka, teksBuka, teksTutup) {
      const wrap = document.getElementById(wrapId);
      const ikon = document.getElementById(ikonId);
      const tombol = ikon.parentElement;
      if (buka) {
        wrap.style.maxHeight = wrap.scrollHeight + 'px';
        ikon.classList.add('rotate-180');
        tombol.lastChild.textContent = teksTutup;
      } else {
        wrap.style.maxHeight = '0';
        ikon.classList.remove('rotate-180');
        tombol.lastChild.textContent = teksBuka;
      }
    }

    let qrTerbuka = false;
    function toggleQR() {
      qrTerbuka = !qrTerbuka;
      slidePanel('qrWrap', 'ikonQR', qrTerbuka, 'Tampilkan Kode QR', 'Sembunyikan Kode QR');
    }

    let editTerbuka = false;
    function toggleEdit() {
      editTerbuka = !editTerbuka;
      slidePanel('formEditWrap', 'ikonEdit', editTerbuka, 'Edit Data', 'Tutup Edit');
    }

    function terapkanTampilanJenis(jenis) {
      const w = WARNA_JENIS[jenis] || WARNA_JENIS.Umum;
      const badge = document.getElementById('tampilJenis');
      badge.textContent = jenis || 'Umum';
      badge.style.background = w.lembut;
      badge.style.color = w.teks;
      document.getElementById('avatarLingkaran').style.background = w.solid;
    }

    function terapkanTampilanStatus(status) {
      document.querySelectorAll('.tombol-status').forEach((btn) => {
        const aktif = btn.dataset.nilai === status;
        btn.classList.toggle('gradient-bg', aktif);
        btn.classList.toggle('text-white', aktif);
        btn.classList.toggle('bg-white', !aktif);
        btn.classList.toggle('text-gray-600', !aktif);
      });
    }

    function terapkanTampilanFoto(data) {
      const gambar = document.getElementById('fotoTampil');
      const huruf = document.getElementById('avatarHuruf');
      if (data.foto) {
        gambar.src = urlFotoAman(data.foto);
        gambar.classList.remove('hidden');
        huruf.classList.add('hidden');
      } else {
        gambar.classList.add('hidden');
        huruf.classList.remove('hidden');
      }

      // Pratinjau di form Edit juga ikut nunjukkan foto yang sudah ada
      const previewGambar = document.getElementById('previewFotoImg');
      const previewIkon = document.getElementById('previewFotoIkon');
      document.getElementById('fFoto').value = '';
      if (data.foto) {
        previewGambar.src = urlFotoAman(data.foto);
        previewGambar.classList.remove('hidden');
        previewIkon.classList.add('hidden');
      } else {
        previewGambar.classList.add('hidden');
        previewIkon.classList.remove('hidden');
      }
    }

    function isiTampilan(data) {
      dataLama = data;
      const nama = data.nama || '';
      document.getElementById('tampilNama').textContent = nama || '-';
      document.getElementById('tampilAlamat').textContent = data.alamat || '-';
      document.getElementById('avatarHuruf').textContent = (nama.trim().charAt(0) || '?').toUpperCase();
      terapkanTampilanJenis(data.jenis || 'Umum');
      terapkanTampilanStatus(data.status || 'belum');
      terapkanTampilanFoto(data);

      // Isi form edit (tersembunyi sampai tombol Edit diklik)
      document.getElementById('nama').value = data.nama || '';
      document.getElementById('alamat').value = data.alamat || '';
      document.getElementById('jenis').value = data.jenis || 'Umum';

      tampilkanTanda(data.ditandai || '');
      document.getElementById('qrcode').innerHTML = '';
      new QRCode(document.getElementById('qrcode'), {
        text: SITE_URL + '?id=' + id,
        width: 200,
        height: 200
      });
    }

    // Ubah status langsung dengan konfirmasi (tombol Sudah/Belum/Tidak)
    async function pilihStatus(nilai) {
      if (peran === 'user') return;
      if (dataLama && dataLama.status === nilai) return;
      const label = { belum: 'Belum', sudah: 'Sudah', none: 'Tidak' };
      const setuju = await konfirmasi(`Ubah status jadi "${label[nilai]}"?`, 'Ya, Ubah');
      if (!setuju) return;

      terapkanTampilanStatus(nilai);
      if (dataLama) dataLama.status = nilai;
      const cache = bacaCacheLokal();
      const idx = cache.findIndex(d => d.id === id);
      if (idx > -1) { cache[idx].status = nilai; simpanCacheLokal(cache); }
      panggilAPI({ aksi: 'status', id, status: nilai }).catch(() => {});
    }

    // Simpan Nama/Alamat/Jama'ah lokal dulu (instan) → kirim ke Google Sheets di belakang layar
    async function simpan() {
      const nama = document.getElementById('nama').value.trim();
      const alamat = document.getElementById('alamat').value.trim();
      const jenis = document.getElementById('jenis').value;
      const status = (dataLama && dataLama.status) || 'belum';
      let foto = (dataLama && dataLama.foto) || '';

      const fileFoto = document.getElementById('fFoto').files[0];
      if (fileFoto) {
        tampilkanLoading();
        const hasil = await uploadFotoKeDrive(fileFoto);
        sembunyikanLoading();
        if (hasil) foto = hasil.url;
      }

      const data = { id, nama, alamat, jenis, status, foto };

      const cache = bacaCacheLokal();
      const idx = cache.findIndex(d => d.id === id);
      const gabung = Object.assign({}, idx > -1 ? cache[idx] : {}, data);
      if (idx > -1) cache[idx] = gabung; else cache.push(gabung);
      simpanCacheLokal(cache);

      isiTampilan(gabung);
      if (editTerbuka) toggleEdit();

      panggilAPI(Object.assign({ aksi: 'simpan' }, data)).then(res => {
        if (!res.ok) alert('Gagal sinkron ke Google Sheets: ' + (res.msg || ''));
      }).catch(() => {});
    }

    // Hanya admin — hapus lokal dulu (instan) → kirim ke Google Sheets di belakang layar
    async function hapus() {
      const setuju = await konfirmasi('Yakin ingin menghapus data ini? Tindakan ini tidak dapat dibatalkan!', 'Ya, Hapus');
      if (!setuju) return;
      const cache = bacaCacheLokal().filter(d => d.id !== id);
      simpanCacheLokal(cache);
      panggilAPI({ aksi: 'hapus', id }).catch(() => {});
      location.href = 'index.html';
    }

    // subAdmin/admin — tandai kesalahan input tanpa menghapus data
    function tandai() {
      const catatan = prompt('Tuliskan catatan kesalahan pada data ini:', dataLama && dataLama.ditandai || '');
      if (catatan === null) return;
      const cache = bacaCacheLokal();
      const idx = cache.findIndex(d => d.id === id);
      if (idx > -1) { cache[idx].ditandai = catatan; simpanCacheLokal(cache); }
      tampilkanTanda(catatan);
      panggilAPI({ aksi: 'tandai', id, catatan }).catch(() => {});
    }

    function bersihkanTanda() {
      const cache = bacaCacheLokal();
      const idx = cache.findIndex(d => d.id === id);
      if (idx > -1) { cache[idx].ditandai = ''; simpanCacheLokal(cache); }
      tampilkanTanda('');
      panggilAPI({ aksi: 'tandai', id, catatan: '' }).catch(() => {});
    }

    function goBack() {
      location.href = 'index.html';
    }
  </script>
