<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplikasi Data Pembagian</title>
  <!-- PWA Manifest -->
  <link rel="manifest" href="app.webmanifest" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PAS" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <!-- AOS Animasi -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <!-- QR Code Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- QR Scanner Library -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <!-- Hash Password -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/forge/2.2.1/forge.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            prim: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            },
            sec: '#0ea5e9',
            warn: '#f59e0b',
            danger: '#ef4444',
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .gradient-bg {
        background: linear-gradient(135deg, #16a34a 0%, #22c55e 50%, #4ade80 100%);
      }
      .gradient-card {
        background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%);
      }
      .content-below-nav {
        padding-top: 4.5rem;
        padding-bottom: 5rem;
      }
      .card-shadow {
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
      }
      .hover-lift {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .hover-lift:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      }
    }
    .card-shadow {
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
      }
      .hover-lift {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .hover-lift:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      }
      /* === ANIMASI LOADING BARU === */
      .loading-spin {
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .tombol-sedang-memuat {
        opacity: 0.6;
        pointer-events: none;
        position: relative;
      }
  </style>
</head>
<body class="bg-prim-50 text-gray-800 font-sans">

  <!-- Navbar -->
  <nav class="gradient-bg fixed top-0 left-0 right-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <h1 class="text-white text-xl font-bold tracking-wide">Data Pembagian</h1>
        <div class="hidden md:flex items-center gap-4">
          <button onclick="openForm()" class="bg-white text-prim-700 px-4 py-2 rounded-lg font-medium hover:bg-prim-100 transition shadow">
            <i class="fa-solid fa-plus mr-2"></i>Tambah Data
          </button>
          <button onclick="openUserMenu()" class="relative text-white text-xl p-2 rounded-full hover:bg-white/20 transition">
            <i class="fa-solid fa-circle-user"></i>
          </button>
        </div>
        <button onclick="openUserMenu()" class="md:hidden text-white text-xl p-2">
          <i class="fa-solid fa-circle-user"></i>
        </button>
      </div>
    </div>
    <!-- Dropdown Menu Profil -->
    <div id="userMenu" class="hidden absolute right-4 mt-2 w-56 bg-white rounded-xl shadow-xl overflow-hidden z-50">
      <div class="p-4 gradient-bg text-white">
        <p class="font-semibold" id="adminName">Admin</p>
        <p class="text-sm opacity-80">Pengguna Aktif</p>
      </div>
      <div class="p-2">
        <button onclick="openUserManage()" class="w-full text-left px-4 py-2 hover:bg-prim-50 rounded flex items-center gap-2">
          <i class="fa-solid fa-users text-prim-600"></i> Kelola Pengguna
        </button>
        <button onclick="logout()" class="w-full text-left px-4 py-2 text-red-600 hover:bg-red-50 rounded flex items-center gap-2">
          <i class="fa-solid fa-right-from-bracket"></i> Keluar
        </button>
      </div>
    </div>
  </nav>

  <!-- Konten Utama -->
  <main class="content-below-nav max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <!-- === INDIKATOR LOADING === -->
  <div id="loadingOverlay" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-2xl p-6 shadow-2xl flex flex-col items-center gap-3">
      <i class="fa-solid fa-circle-notch text-3xl text-prim-600 loading-spin"></i>
      <span class="text-gray-700 font-medium">Sedang memproses...</span>
    </div>
  </div>
    <!-- Dashboard Card -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8 mt-4">
      <div data-aos="fade-up" onclick="loadData('all')" class="gradient-card rounded-xl p-4 card-shadow hover-lift cursor-pointer">
        <p class="text-gray-500 text-sm">Total Data</p>
        <h3 class="text-2xl font-bold text-prim-800" id="totalAll">0</h3>
      </div>
      <div data-aos="fade-up" data-aos-delay="50" onclick="loadData('belum')" class="gradient-card rounded-xl p-4 card-shadow hover-lift cursor-pointer">
        <p class="text-gray-500 text-sm">Belum Diambil</p>
        <h3 class="text-2xl font-bold text-warn" id="totalBelum">0</h3>
      </div>
      <div data-aos="fade-up" data-aos-delay="100" onclick="loadData('sudah')" class="gradient-card rounded-xl p-4 card-shadow hover-lift cursor-pointer">
        <p class="text-gray-500 text-sm">Sudah Diambil</p>
        <h3 class="text-2xl font-bold text-sec" id="totalSudah">0</h3>
      </div>
      <div data-aos="fade-up" data-aos-delay="150" onclick="loadData('none')" class="gradient-card rounded-xl p-4 card-shadow hover-lift cursor-pointer">
        <p class="text-gray-500 text-sm">Tidak Ambil</p>
        <h3 class="text-2xl font-bold text-gray-600" id="totalNone">0</h3>
      </div>
      <div data-aos="fade-up" data-aos-delay="200" onclick="loadData('salikin')" class="gradient-card rounded-xl p-4 card-shadow hover-lift cursor-pointer">
        <p class="text-gray-500 text-sm">Salikin/Salikah</p>
        <h3 class="text-2xl font-bold text-fuchsia-600" id="totalSalikin">0</h3>
      </div>
    </div>

    <!-- Filter Data -->
    <div data-aos="fade-up" class="bg-white rounded-xl shadow-lg p-4 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="text-sm text-gray-500">Jenis</label>
          <select id="filterJenis" onchange="terapkanFilter()" class="w-full p-2 border rounded-lg mt-1">
            <option value="">Semua</option>
            <option value="Umum">Umum</option>
            <option value="Salikin">Salikin</option>
            <option value="Salikah">Salikah</option>
          </select>
        </div>
        <div>
          <label class="text-sm text-gray-500">Alamat</label>
          <select id="filterAlamat" onchange="terapkanFilter()" class="w-full p-2 border rounded-lg mt-1">
            <option value="">Semua Alamat</option>
          </select>
        </div>
        <div class="flex items-end">
          <button onclick="resetFilter()" class="w-full p-2 border rounded-lg text-gray-600 hover:bg-gray-50">
            <i class="fa-solid fa-rotate-right mr-2"></i>Reset Filter
          </button>
        </div>
      </div>
    </div>

    <!-- Tabel Data -->
    <div data-aos="fade-up" class="bg-white rounded-xl shadow-lg p-4 overflow-x-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-prim-800">Daftar Data</h2>
        <span class="text-sm text-gray-500" id="filterInfo">Semua Data</span>
      </div>
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-prim-100 text-prim-900">
            <th class="p-3 text-left rounded-tl-lg">No</th>
            <th class="p-3 text-left">Nama</th>
            <th class="p-3 text-left">Jama'ah</th>
            <th class="p-3 text-center">Status</th>
            <th class="p-3 text-center rounded-tr-lg">Aksi</th>
          </tr>
        </thead>
        <tbody id="dataTable">
          <tr><td colspan="6" class="p-4 text-center text-gray-500">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal Scan QR -->
  <div id="scanModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
    <div class="bg-white rounded-2xl p-4 w-full max-w-md shadow-2xl">
      <h3 class="text-lg font-bold text-center text-prim-700 mb-3">Pindai Kode QR</h3>
      <video id="qrVideo" class="w-full rounded-lg bg-black" autoplay playsinline></video>
      <canvas id="qrCanvas" class="hidden"></canvas>
      <div class="flex gap-3 mt-4">
        <button onclick="tutupScanQR()" class="flex-1 py-2 border rounded-lg">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Menu Bawah HP -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_20px_rgba(0,0,0,0.15)] z-40">
    <div class="flex justify-around items-center py-2">
      <button onclick="bukaScanQR()" class="flex flex-col items-center text-gray-600 p-2">
        <i class="fa-solid fa-qrcode text-xl"></i>
        <span class="text-xs mt-1">Scan QR</span>
      </button>
      <button onclick="openForm()" class="flex flex-col items-center text-white gradient-bg rounded-full w-14 h-14 -mt-6 shadow-lg justify-center">
        <i class="fa-solid fa-plus text-xl"></i>
      </button>
      <button onclick="openUserManage()" class="flex flex-col items-center text-gray-600 p-2">
        <i class="fa-solid fa-users text-xl"></i>
        <span class="text-xs mt-1">Pengguna</span>
      </button>
    </div>
  </nav>

  <!-- Modal Form Tambah/Edit Data -->
  <div id="formModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl" data-aos="zoom-in">
      <h3 class="text-xl font-bold text-prim-700 mb-4" id="formTitle">Tambah Data</h3>
      <div class="space-y-3">
        <input type="text" id="fNama" placeholder="Nama" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-prim-400 outline-none" required />
        <input type="text" id="fAlamat" placeholder="Alamat" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-prim-400 outline-none" />
        <div>
          <label class="text-sm text-gray-500">Jenis</label>
          <select id="fJenis" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-prim-400 outline-none">
            <option value="Umum">Umum</option>
            <option value="Salikin">Salikin</option>
            <option value="Salikah">Salikah</option>
          </select>
        </div>
        <input type="hidden" id="editId" />
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="closeForm()" class="flex-1 py-2 border border-gray-300 rounded-lg hover:bg-gray-100">Batal</button>
        <button onclick="saveData()" class="flex-1 py-2 gradient-bg text-white rounded-lg hover:opacity-90">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Modal Login -->
  <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
    <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl" data-aos="zoom-in">
      <h3 class="text-2xl font-bold text-center text-prim-700 mb-6">Login Admin</h3>
      <div class="space-y-4">
        <input type="text" id="uName" placeholder="Nama Pengguna" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-prim-400 outline-none" />
        <input type="password" id="uPass" placeholder="Kata Sandi" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-prim-400 outline-none" />
      </div>
      <button onclick="doLogin()" class="w-full mt-6 py-3 gradient-bg text-white rounded-lg font-medium hover:opacity-90">Masuk</button>
      <p id="loginErr" class="text-red-500 text-sm mt-2 text-center hidden">Nama atau sandi salah!</p>
    </div>
  </div>

  <!-- Modal Kelola Pengguna -->
  <div id="userModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto">
      <h3 class="text-xl font-bold text-prim-700 mb-4">Kelola Pengguna</h3>
      <div class="space-y-3 border-b pb-4 mb-4">
        <input type="text" id="newUser" placeholder="Nama Pengguna Baru" class="w-full p-3 border rounded-lg" />
        <input type="password" id="newPass" placeholder="Kata Sandi" class="w-full p-3 border rounded-lg" />
        <button onclick="addUser()" class="w-full py-2 gradient-bg text-white rounded-lg">Tambah Pengguna</button>
      </div>
      <div id="userList" class="space-y-2"></div>
      <button onclick="closeUserManage()" class="w-full mt-4 py-2 border rounded-lg">Tutup</button>
    </div>
  </div>

  <script>
    // === KONFIGURASI ===
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxPG7wWRSC15XhG2_-Faful-IjgZOdMD3KT1aVdXmvz9HCfDGw5kO0oQvm4SOvY5Tlj/exec"; // GANTI URL DEPLOYMENT-MU
    const SITE_URL = window.location.origin + window.location.pathname.replace(/index\.html$/, '');
    let loggedIn = false;
    let currentFilter = "all";
    let semuaData = [];

    // Hash password
    async function hashPass(pass) {
      const encoder = new TextEncoder();
      const data = encoder.encode(pass);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Login
    async function doLogin() {
      const u = document.getElementById('uName').value.trim();
      const p = document.getElementById('uPass').value.trim();
      const h = await hashPass(p);
      const adminHash = await hashPass("admin123");
      if (u === "admin" && h === adminHash) {
        loggedIn = true;
        localStorage.setItem('user', u);
        document.getElementById('loginModal').classList.add('hidden');
        loadData('all');
        return;
      }
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ aksi: 'cekUser', user: u, pass: h })
      }).then(r => r.json());
      if (res.ok) {
        loggedIn = true;
        localStorage.setItem('user', u);
        document.getElementById('loginModal').classList.add('hidden');
        loadData('all');
      } else {
        document.getElementById('loginErr').classList.remove('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('user');
      location.reload();
    }

    function openUserMenu() {
      document.getElementById('userMenu').classList.toggle('hidden');
    }

    // === SCAN QR DENGAN KAMERA ===
    let kameraStream = null;
    let pemindaiAktif = false;

    async function bukaScanQR() {
      document.getElementById('scanModal').classList.remove('hidden');
      pemindaiAktif = true;
      const video = document.getElementById('qrVideo');
      try {
        kameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        video.srcObject = kameraStream;
        video.onloadedmetadata = () => {
          video.play();
          pindaiQR();
        };
      } catch (err) {
        alert('Tidak dapat mengakses kamera: ' + err.message);
        tutupScanQR();
      }
    }

    function tutupScanQR() {
      document.getElementById('scanModal').classList.add('hidden');
      pemindaiAktif = false;
      if (kameraStream) {
        kameraStream.getTracks().forEach(t => t.stop());
        kameraStream = null;
      }
    }

    function pindaiQR() {
      if (!pemindaiAktif) return;
      const video = document.getElementById('qrVideo');
      const canvas = document.getElementById('qrCanvas');
      const ctx = canvas.getContext('2d');
      if (video.videoWidth === 0) return setTimeout(pindaiQR, 100);

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const kode = jsQR(imgData.data, canvas.width, canvas.height);

      if (kode) {
        tutupScanQR();
        const url = kode.data;
        const params = new URLSearchParams(url.split('?')[1]);
        const id = params.get('id');
        if (id) {
          window.location.href = url;
        } else {
          alert('QR tidak berisi data yang valid');
        }
        return;
      }
      setTimeout(pindaiQR, 300);
    }

    // Data CRUD
    async function loadData(filter = 'all') {
      tampilkanLoading();
      if (!loggedIn) return;
      currentFilter = filter;
      const labels = {
        all: 'Semua Data', belum: 'Belum Diambil', sudah: 'Sudah Diambil',
        none: 'Tidak Ambil', salikin: 'Salikin & Salikah'
      };
      document.getElementById('filterInfo').textContent = labels[filter];
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ aksi: 'baca', filter })
      }).then(r => r.json());
      semuaData = res.data || [];
      isiFilterAlamat();
      terapkanFilter();
      document.getElementById('totalAll').textContent = res.stats.all || 0;
      document.getElementById('totalBelum').textContent = res.stats.belum || 0;
      document.getElementById('totalSudah').textContent = res.stats.sudah || 0;
      document.getElementById('totalNone').textContent = res.stats.none || 0;
      document.getElementById('totalSalikin').textContent = res.stats.salikin || 0;
      sembunyikanLoading();
    }

    function isiFilterAlamat() {
      const alamatUnik = [...new Set(semuaData.map(d => d.alamat).filter(a => a))].sort();
      const select = document.getElementById('filterAlamat');
      const nilaiSekarang = select.value;
      select.innerHTML = '<option value="">Semua Alamat</option>';
      alamatUnik.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a;
        opt.textContent = a;
        select.appendChild(opt);
      });
      select.value = nilaiSekarang;
    }

    function terapkanFilter() {
      const jenis = document.getElementById('filterJenis').value;
      const alamat = document.getElementById('filterAlamat').value;
      let dataTampil = [...semuaData];

      if (currentFilter === 'belum') dataTampil = dataTampil.filter(d => d.status === 'belum');
      else if (currentFilter === 'sudah') dataTampil = dataTampil.filter(d => d.status === 'sudah');
      else if (currentFilter === 'none') dataTampil = dataTampil.filter(d => d.status === 'none');
      else if (currentFilter === 'salikin') dataTampil = dataTampil.filter(d => d.jenis === 'Salikin' || d.jenis === 'Salikah');

      if (jenis) dataTampil = dataTampil.filter(d => d.jenis === jenis);
      if (alamat) dataTampil = dataTampil.filter(d => d.alamat === alamat);

      renderTable(dataTampil);
    }

    function resetFilter() {
      document.getElementById('filterJenis').value = '';
      document.getElementById('filterAlamat').value = '';
      loadData('all');
    }

    function renderTable(arr) {
      const tb = document.getElementById('dataTable');
      if (!arr.length) {
        tb.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Data kosong</td></tr>`;
        return;
      }
    tb.innerHTML = arr.map((d, i) => `
        <tr class="border-b hover:bg-prim-50">
          <td class="p-3">${i+1}</td>
          <td class="p-3">${d.nama || '-'}</td>
          <td class="p-3">
            <span class="px-2 py-1 rounded-full text-xs font-medium ${
              d.jenis === 'Salikin' ? 'bg-fuchsia-100 text-fuchsia-700' :
              d.jenis === 'Salikah' ? 'bg-pink-100 text-pink-700' : 'bg-sky-100 text-sky-700'
            }">${d.jenis || 'Umum'}</span>
          </td>
          <td class="p-3">${d.alamat || '-'}</td>  <!-- ❌ HAPUS BARIS INI -->
          <td class="p-3 text-center">
            <button onclick="event.stopPropagation(); toggleStatus('${d.id}','${d.status}')" 
              class="text-xl">
              ${d.status === 'sudah' ? '<i class="fa-solid fa-check text-green-600"></i>' :
                d.status === 'belum' ? '<i class="fa-solid fa-xmark text-red-500"></i>' :
                '<i class="fa-solid fa-question text-gray-500"></i>'}
            </button>
          </td>
          <td class="p-3 text-center">
            <button onclick="openDetail('${d.id}')" class="px-3 py-1 bg-prim-100 text-prim-700 rounded-lg text-sm font-medium hover:bg-prim-200">
              Detail
            </button>
          </td>
        </tr>
      `).join('');
    }

    function openForm() {
      document.getElementById('formModal').classList.remove('hidden');
      document.getElementById('formTitle').textContent = 'Tambah Data';
      document.getElementById('fNama').value = '';
      document.getElementById('fAlamat').value = '';
      document.getElementById('fJenis').value = 'Umum';
      document.getElementById('editId').value = '';
    }
    function closeForm() {
      document.getElementById('formModal').classList.add('hidden');
    }

    async function saveData() {
      tampilkanLoading();
      const id = document.getElementById('editId').value || ('d' + Date.now());
      const data = {
        aksi: 'simpan',
        id,
        nama: document.getElementById('fNama').value.trim(),
        alamat: document.getElementById('fAlamat').value.trim(),
        jenis: document.getElementById('fJenis').value,
        status: 'belum'
      };
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(data) });
      closeForm();
      loadData('all');
      sembunyikanLoading();
    }

    async function toggleStatus(id, st) {
      tampilkanLoading();
      const next = st === 'belum' ? 'sudah' : (st === 'sudah' ? 'none' : 'belum');
      await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ aksi: 'status', id, status: next })
      });
      loadData(currentFilter);
      sembunyikanLoading();
    }

    function openDetail(id) {
      window.location.href = SITE_URL + 'detail.html?id=' + id;
    }

    // Pengguna
    function openUserManage() {
      document.getElementById('userModal').classList.remove('hidden');
      loadUsers();
    }
    function closeUserManage() {
      document.getElementById('userModal').classList.add('hidden');
    }
    async function loadUsers() {
      const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ aksi: 'bacaUser' }) }).then(r => r.json());
      document.getElementById('userList').innerHTML = (res.users || []).map(u => `
        <div class="flex justify-between items-center p-2 bg-gray-50 rounded">
          <span>${u.user}</span>
          <button onclick="delUser('${u.user}')" class="text-red-500 text-sm">Hapus</button>
        </div>
      `).join('');
    }
    async function addUser() {
      tampilkanLoading();
      const u = document.getElementById('newUser').value.trim();
      const p = document.getElementById('newPass').value.trim();
      if (!u || !p) return alert('Lengkapi data!');
      const h = await hashPass(p);
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ aksi: 'tambahUser', user: u, pass: h }) });
      document.getElementById('newUser').value = '';
      document.getElementById('newPass').value = '';
      loadUsers();
      sembunyikanLoading();
    }
    async function delUser(u) {
      tampilkanLoading();
      if (confirm('Hapus pengguna ini?')) {
        await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ aksi: 'hapusUser', user: u }) });
        loadUsers();
        sembunyikanLoading();
      }
    }

    // === PEMASANGAN PWA ===
    let pemasangPWA = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      pemasangPWA = e;
      tampilkanTombolPasang();
    });

    function tampilkanTombolPasang() {
      if (!pemasangPWA) return;
      const tombol = document.createElement('button');
      tombol.className = 'fixed top-10 right-4 bg-white shadow-lg rounded-lg px-4 py-2 text-prim-700 text-sm font-medium z-9930 hover:bg-prim-50';
      tombol.innerHTML = '<i class="fa-solid fa-download mr-2"></i>Pasang Aplikasi';
      tombol.onclick = async () => {
        tombol.remove();
        const hasil = await pemasangPWA.prompt();
        if (hasil.outcome === 'accepted') alert('Aplikasi sedang dipasang!');
        pemasangPWA = null;
      };
      document.body.appendChild(tombol);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('PWA Aktif:', reg.scope))
        .catch(err => console.log('SW Error:', err));
    }

    // Inisialisasi
    document.addEventListener('DOMContentLoaded', () => {
      AOS.init({ duration: 600, once: true });
      if (localStorage.getItem('user')) {
        document.getElementById('loginModal').classList.add('hidden');
        loggedIn = true;
        loadData('all');
      }
    });

        // === FUNGSI TAMPIL/SEMBUNYIKAN LOADING ===
    function tampilkanLoading() {
      document.getElementById('loadingOverlay').classList.remove('hidden');
    }
    function sembunyikanLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }
    
  </script>
</body>
</html>
