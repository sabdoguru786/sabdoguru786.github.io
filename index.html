  <script>
    // === KONFIGURASI ===
    // Catatan keamanan: URL ini tidak "rahasia" (selalu terlihat via view-source begitu situs live),
    // jadi perlindungan sesungguhnya ada di server (Code.gs) yang memvalidasi user+sandi di setiap aksi.
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzW5OJoQVZ-mJmQ0dC7Wvsg49BY6itH8niXebutRFFPqwU9PDAb9RJyeWeMIcWBg7uF/exec"; // GANTI URL DEPLOYMENT-MU
    const SITE_URL = window.location.origin + window.location.pathname.replace(/index\.html$/, '');
    const CACHE_KEY = 'pasDataCache';
    let loggedIn = false;
    let currentFilter = "all";
    let semuaData = [];
    let peran = 'user'; // admin | subAdmin | user

    // Panggil backend dengan identitas pengguna otomatis disertakan (dipakai server untuk otorisasi)
    // Selalu balikin objek {ok:false, msg} kalau gagal — jangan pernah lempar error mentah ke console
    async function panggilAPI(payload) {
      const body = Object.assign({
        user: localStorage.getItem('user') || '',
        userPass: localStorage.getItem('sandiHash') || ''
      }, payload);
      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(body) });
        return await res.json();
      } catch (e) {
        return { ok: false, msg: 'Tidak bisa terhubung ke server. Cek URL Apps Script/koneksi internet.' };
      }
    }

    // Normalisasi URL foto Drive — link lama format "uc?export=view&id=..." kadang gagal
    // tampil kalau dipasang di <img> lintas-situs (Google kadang balas halaman konfirmasi,
    // bukan gambar aslinya). Ambil ID file-nya lalu pakai domain lh3.googleusercontent.com
    // yang terbukti selalu langsung mengembalikan gambar tanpa redirect.
    function urlFotoAman(url) {
      if (!url) return '';
      const cocok = url.match(/[?&]id=([^&]+)/) || url.match(/\/d\/([^/?]+)/);
      return cocok ? `https://lh3.googleusercontent.com/d/${cocok[1]}` : url;
    }

    // === MODAL KONFIRMASI (pengganti confirm() bawaan browser) ===
    function konfirmasi(pesan, labelYa) {
      return new Promise((resolve) => {
        document.getElementById('konfirmPesan').textContent = pesan;
        document.getElementById('konfirmYa').textContent = labelYa || 'Ya, Lanjutkan';
        document.getElementById('konfirmModal').classList.remove('hidden');
        const tombolYa = document.getElementById('konfirmYa');
        const tombolBatal = document.getElementById('konfirmBatal');
        function bersihkan(hasil) {
          document.getElementById('konfirmModal').classList.add('hidden');
          tombolYa.removeEventListener('click', onYa);
          tombolBatal.removeEventListener('click', onBatal);
          resolve(hasil);
        }
        function onYa() { bersihkan(true); }
        function onBatal() { bersihkan(false); }
        tombolYa.addEventListener('click', onYa);
        tombolBatal.addEventListener('click', onBatal);
      });
    }

    // === CACHE LOKAL (biar tidak nunggu koneksi Google Sheets tiap buka) ===
    function bacaCacheLokal() {
      try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); } catch (e) { return []; }
    }
    function simpanCacheLokal(data) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
    }

    // Logout selalu kembali ke Beranda (home.html)
    function logout() {
      ['user', 'sandiHash', 'role', 'namaLengkap', 'alamat', 'jamaah', 'munasiq'].forEach(k => localStorage.removeItem(k));
      window.location.href = 'home.html';
    }

    function openUserMenu() {
      document.getElementById('userMenu').classList.toggle('hidden');
    }

    function openProfile() {
      document.getElementById('userMenu').classList.add('hidden');
      const username = localStorage.getItem('user') || '-';
      const namaLengkap = localStorage.getItem('namaLengkap') || '';
      const alamat = localStorage.getItem('alamat') || '';
      const jamaah = localStorage.getItem('jamaah') || '';
      const munasiq = localStorage.getItem('munasiq') || '';

      document.getElementById('profileNama').textContent = namaLengkap || username;
      const labelPeran = { admin: 'Admin (akses penuh)', subAdmin: 'Sub Admin (kelola data)', user: 'Pengguna (lihat saja)' };
      document.getElementById('profileRole').textContent = labelPeran[peran] || peran;
      const ket = {
        admin: 'Bisa mengelola semua data, pengguna, dan tampilan Beranda.',
        subAdmin: 'Bisa tambah/ubah data, tidak bisa menghapus — hanya bisa menandai kesalahan.',
        user: 'Hanya bisa melihat data, tidak bisa mengubah apapun.'
      };
      document.getElementById('profileKeterangan').textContent = ket[peran] || '';

      const baris = [];
      baris.push(['Username', username]);
      if (namaLengkap) baris.push(['Nama Lengkap', namaLengkap]);
      if (alamat) baris.push(['Alamat', alamat]);
      if (jamaah) baris.push(["Jama'ah", jamaah]);
      if (munasiq) baris.push(['Munasiq', munasiq]);
      document.getElementById('profileDetail').innerHTML = baris.map(([label, nilai]) =>
        `<div class="flex justify-between gap-2"><span class="text-gray-500">${label}</span><span class="font-medium text-gray-700 text-right">${nilai}</span></div>`
      ).join('');

      document.getElementById('btnProfileSetting').classList.toggle('hidden', peran !== 'admin');
      document.getElementById('profileModal').classList.remove('hidden');
    }
    function closeProfile() {
      document.getElementById('profileModal').classList.add('hidden');
    }

    // Terapkan batasan tampilan sesuai peran (admin/subAdmin/user)
    function terapkanPeran() {
      document.getElementById('adminName').textContent = localStorage.getItem('user') || 'Pengguna';
      const labelPeran = { admin: 'Admin', subAdmin: 'Sub Admin', user: 'Pengguna' };
      document.getElementById('adminRole').textContent = labelPeran[peran] || peran;

      const bisaTambah = peran === 'admin' || peran === 'subAdmin';
      document.getElementById('btnTambahDesktop').classList.toggle('hidden', !bisaTambah);
      document.getElementById('btnTambahHp').classList.toggle('hidden', !bisaTambah);
      document.getElementById('menuSetting').classList.toggle('hidden', peran !== 'admin');
    }

    // === SCAN QR DENGAN KAMERA ===
    let kameraStream = null;
    let pemindaiAktif = false;

    async function bukaScanQR() {
      document.getElementById('scanModal').classList.remove('hidden');
      pemindaiAktif = true;
      const video = document.getElementById('qrVideo');
      try {
        kameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        video.srcObject = kameraStream;
        video.onloadedmetadata = () => {
          video.play();
          pindaiQR();
        };
      } catch (err) {
        alert('Tidak dapat mengakses kamera: ' + err.message);
        tutupScanQR();
      }
    }

    function tutupScanQR() {
      document.getElementById('scanModal').classList.add('hidden');
      pemindaiAktif = false;
      if (kameraStream) {
        kameraStream.getTracks().forEach(t => t.stop());
        kameraStream = null;
      }
    }

    function pindaiQR() {
      if (!pemindaiAktif) return;
      const video = document.getElementById('qrVideo');
      const canvas = document.getElementById('qrCanvas');
      const ctx = canvas.getContext('2d');
      if (video.videoWidth === 0) return setTimeout(pindaiQR, 100);

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const kode = jsQR(imgData.data, canvas.width, canvas.height);

      if (kode) {
        tutupScanQR();
        const url = kode.data;
        const params = new URLSearchParams(url.split('?')[1]);
        const id = params.get('id');
        if (id) {
          window.location.href = url;
        } else {
          alert('QR tidak berisi data yang valid');
        }
        return;
      }
      setTimeout(pindaiQR, 300);
    }

    // === Data: muat dari cache lokal dulu (instan), lalu sinkron ke Google Sheets di belakang layar ===
    async function loadData(filter = 'all') {
      if (!loggedIn) return;
      currentFilter = filter;
      document.getElementById('ikonSinkron').classList.add('loading-spin');

      const cache = bacaCacheLokal();
      if (cache.length) {
        semuaData = cache;
        isiFilterAlamat();
        terapkanFilter();
        hitungStatistik();
      } else {
        tampilkanLoading();
      }

      try {
        const res = await panggilAPI({ aksi: 'baca', filter: 'all' });
        if (res.ok) {
          semuaData = res.data || [];
          simpanCacheLokal(semuaData);
          isiFilterAlamat();
          terapkanFilter();
          hitungStatistik();
        } else if (!cache.length) {
          document.getElementById('dataTable').innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">${res.msg || 'Gagal memuat data'}</td></tr>`;
        }
      } catch (e) {
        // Offline / Sheets lambat — tetap tampilkan data cache lokal yang sudah ada
      }
      document.getElementById('ikonSinkron').classList.remove('loading-spin');
      sembunyikanLoading();
    }

    // Pindah tab dashboard TANPA fetch ulang ke Sheets — cukup filter data yang sudah ada di memori
    function pilihFilter(filter) {
      currentFilter = filter;
      terapkanFilter();
    }

    function hitungStatistik() {
      document.getElementById('totalAll').textContent = semuaData.length;
      document.getElementById('totalBelum').textContent = semuaData.filter(d => d.status === 'belum').length;
      document.getElementById('totalSudah').textContent = semuaData.filter(d => d.status === 'sudah').length;
      document.getElementById('totalNone').textContent = semuaData.filter(d => d.status === 'none').length;
      document.getElementById('totalUmum').textContent = semuaData.filter(d => d.jenis === 'Umum').length;
      document.getElementById('totalSalikin').textContent = semuaData.filter(d => d.jenis === 'Salikin' || d.jenis === 'Salikah').length;
    }

    function isiFilterAlamat() {
      const alamatUnik = [...new Set(semuaData.map(d => d.alamat).filter(a => a))].sort();
      const select = document.getElementById('filterAlamat');
      const nilaiSekarang = select.value;
      select.innerHTML = '<option value="">Semua Alamat</option>';
      alamatUnik.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a;
        opt.textContent = a;
        select.appendChild(opt);
      });
      select.value = nilaiSekarang;
    }

    function resetFilter() {
      const ikon = document.getElementById('ikonReset');
      ikon.classList.add('loading-spin');
      document.getElementById('filterJenis').value = '';
      document.getElementById('filterAlamat').value = '';
      document.getElementById('cariData').value = '';
      pilihFilter('all');
      setTimeout(() => ikon.classList.remove('loading-spin'), 400);
    }

    function renderTable(arr) {
      const tb = document.getElementById('dataTable');
      const bisaAksi = peran === 'admin' || peran === 'subAdmin';
      document.getElementById('jumlahDataFilter').textContent = `(${arr.length})`;
      if (!arr.length) {
        tb.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Data kosong</td></tr>`;
        return;
      }
      tb.innerHTML = arr.map((d) => `
        <tr class="border-b hover:bg-prim-50">
          <td class="p-3">
            <div class="flex items-center gap-2">
              ${d.foto
                ? `<img src="${urlFotoAman(d.foto)}" class="w-7 h-9 object-cover rounded flex-shrink-0" alt="">`
                : `<span class="w-7 h-9 rounded bg-gray-100 flex items-center justify-center text-gray-300 flex-shrink-0"><i class="fa-solid fa-image text-xs"></i></span>`}
              <span>${d.nama || '-'}</span>
              ${d.ditandai ? `<span title="${d.ditandai}" class="text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-600"><i class="fa-solid fa-triangle-exclamation"></i> Ditandai</span>` : ''}
            </div>
          </td>
          <td class="p-3">
            <span class="px-2 py-1 rounded-full text-xs font-medium ${
              d.jenis === 'Salikin' ? 'bg-fuchsia-100 text-fuchsia-700' :
              d.jenis === 'Salikah' ? 'bg-pink-100 text-pink-700' : 'bg-sky-100 text-sky-700'
            }">${d.jenis || 'Umum'}</span>
          </td>
          <td class="p-3 text-center">
            ${bisaAksi ? `
            <button onclick="event.stopPropagation(); toggleStatus('${d.id}','${d.status}')"
              class="text-xl">
              ${d.status === 'sudah' ? '<i class="fa-solid fa-check text-green-600"></i>' :
                d.status === 'belum' ? '<i class="fa-solid fa-question text-gray-500"></i>' :
                '<i class="fa-solid fa-xmark text-red-500"></i>'}
            </button>` : `
              ${d.status === 'sudah' ? '<i class="fa-solid fa-check text-green-600 text-xl"></i>' :
                d.status === 'belum' ? '<i class="fa-solid fa-question text-gray-500 text-xl"></i>' :
                '<i class="fa-solid fa-xmark text-red-500 text-xl"></i>'}
            `}
          </td>
          <td class="p-3 text-center">
            <button onclick="openDetail('${d.id}')" class="px-3 py-1 bg-prim-100 text-prim-700 rounded-lg text-sm font-medium hover:bg-prim-200">
              Detail
            </button>
          </td>
        </tr>
      `).join('');
    }

    function openForm() {
      document.getElementById('formModal').classList.remove('hidden');
      document.getElementById('formTitle').textContent = 'Tambah Data';
      document.getElementById('fNama').value = '';
      document.getElementById('fAlamat').value = '';
      document.getElementById('fJenis').value = 'Umum';
      document.getElementById('editId').value = '';
      document.getElementById('fFoto').value = '';
      document.getElementById('previewFotoImg').classList.add('hidden');
      document.getElementById('previewFotoIkon').classList.remove('hidden');
    }
    function closeForm() {
      document.getElementById('formModal').classList.add('hidden');
    }

    // Pratinjau langsung di form begitu file dipilih (sebelum benar-benar diupload saat Simpan)
    function pratinjauFoto() {
      const file = document.getElementById('fFoto').files[0];
      if (!file) return;
      const gambar = document.getElementById('previewFotoImg');
      const ikon = document.getElementById('previewFotoIkon');
      const reader = new FileReader();
      reader.onload = () => {
        gambar.src = reader.result;
        gambar.classList.remove('hidden');
        ikon.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }
    function bacaFileSebagaiBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    async function uploadFotoKeDrive(file) {
      if (file.size > 8 * 1024 * 1024) {
        alert('Ukuran foto maksimal 8MB');
        return null;
      }
      const base64 = await bacaFileSebagaiBase64(file);
      const res = await panggilAPI({ aksi: 'uploadFoto', base64, mime: file.type, namaFile: file.name });
      if (!res.ok) { alert('Gagal unggah foto: ' + (res.msg || '')); return null; }
      return res; // { ok, url, fileId }
    }

    // Simpan lokal dulu (instan) → kirim ke Google Sheets di belakang layar
    // (kalau ada foto baru, tunggu upload ke Drive dulu supaya URL-nya siap sebelum disimpan)
    async function saveData() {
      const nama = document.getElementById('fNama').value.trim();
      if (!nama) { alert('Nama wajib diisi'); return; }
      const id = document.getElementById('editId').value || ('d' + Date.now());
      const alamat = document.getElementById('fAlamat').value.trim();
      const jenis = document.getElementById('fJenis').value;

      const idx = semuaData.findIndex(d => d.id === id);
      let foto = idx > -1 ? (semuaData[idx].foto || '') : '';
      const fileFoto = document.getElementById('fFoto').files[0];
      if (fileFoto) {
        tampilkanLoading();
        const hasil = await uploadFotoKeDrive(fileFoto);
        sembunyikanLoading();
        if (hasil) foto = hasil.url;
      }

      const status = idx > -1 ? semuaData[idx].status : 'belum';
      const ditandai = idx > -1 ? semuaData[idx].ditandai : '';
      const rowBaru = { id, nama, alamat, jenis, status, tgl: new Date().toLocaleString('id-ID'), ditandai, foto };
      if (idx > -1) semuaData[idx] = rowBaru; else semuaData.push(rowBaru);
      simpanCacheLokal(semuaData);
      closeForm();
      isiFilterAlamat();
      terapkanFilter();
      hitungStatistik();

      panggilAPI({ aksi: 'simpan', id, nama, alamat, jenis, status, foto }).then(res => {
        if (!res.ok) alert('Gagal sinkron ke Google Sheets: ' + (res.msg || ''));
      }).catch(() => {});
    }

    async function toggleStatus(id, st) {
      const next = st === 'belum' ? 'sudah' : (st === 'sudah' ? 'none' : 'belum');
      const labelStatus = { belum: 'Belum Diambil', sudah: 'Sudah Diambil', none: 'Tidak Ambil' };
      const setuju = await konfirmasi(`Ubah status jadi "${labelStatus[next]}"?`, 'Ya, Ubah');
      if (!setuju) return;

      const idx = semuaData.findIndex(d => d.id === id);
      if (idx > -1) semuaData[idx].status = next;
      simpanCacheLokal(semuaData);
      terapkanFilter();
      hitungStatistik();
      panggilAPI({ aksi: 'status', id, status: next }).catch(() => {});
    }

    function openDetail(id) {
      window.location.href = SITE_URL + 'detail.html?id=' + id;
    }

    // === PEMASANGAN PWA (tombol "Instal" di menu navbar) ===
    let pemasangPWA = null;
    function sudahTerinstall() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      pemasangPWA = e;
      if (!sudahTerinstall()) document.getElementById('btnInstal').classList.remove('hidden');
    });
    window.addEventListener('appinstalled', () => {
      document.getElementById('btnInstal').classList.add('hidden');
      pemasangPWA = null;
    });
    async function pasangPWA() {
      document.getElementById('userMenu').classList.add('hidden');
      if (!pemasangPWA) return;
      const hasil = await pemasangPWA.prompt();
      if (hasil.outcome === 'accepted') document.getElementById('btnInstal').classList.add('hidden');
      pemasangPWA = null;
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('PWA Aktif:', reg.scope))
        .catch(err => console.log('SW Error:', err));
    }

    // Inisialisasi
    // Halaman Data Pembagian ini khusus admin/subAdmin, ATAU role user yang jama'ahnya
    // Salikin/Salikah dengan Munasiq "Brebes Selatan" — selain itu diarahkan ke hikmah.html
    function bolehAksesIndex(role, jamaah, munasiq) {
      if (role !== 'user') return true;
      // Samakan dulu formatnya (trim + lowercase) sebelum dibandingkan — jangan sensitif
      // besar/kecil huruf, sama seperti pengecekan Munasiq di bawah ini.
      const jamaahNorm = (jamaah || '').trim().toLowerCase();
      const munasiqCocok = (munasiq || '').trim().toLowerCase().includes('brebes selatan');
      return (jamaahNorm === 'salikin' || jamaahNorm === 'salikah') && munasiqCocok;
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('user') || !localStorage.getItem('sandiHash')) {
        location.href = 'register.html';
        return;
      }
      peran = localStorage.getItem('role') || 'admin';
      if (!bolehAksesIndex(peran, localStorage.getItem('jamaah'), localStorage.getItem('munasiq'))) {
        location.href = 'hikmah.html';
        return;
      }
      AOS.init({ duration: 600, once: true });
      loggedIn = true;
      terapkanPeran();
      loadData('all');
    });

    // === FUNGSI TAMPIL/SEMBUNYIKAN LOADING ===
    function tampilkanLoading() {
      document.getElementById('loadingOverlay').classList.remove('hidden');
    }
    function sembunyikanLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }

    // === PENCARIAN & FILTER (semua dihitung dari data yang sudah ada di memori/cache) ===
    function cariSaatMengetik() {
      terapkanFilter();
    }

    function terapkanFilter() {
      const jenis = document.getElementById('filterJenis').value;
      const alamat = document.getElementById('filterAlamat').value;
      const kata = (document.getElementById('cariData')?.value || "").trim().toLowerCase();
      let dataTampil = [...semuaData];

      if (currentFilter === 'belum') dataTampil = dataTampil.filter(d => d.status === 'belum');
      else if (currentFilter === 'sudah') dataTampil = dataTampil.filter(d => d.status === 'sudah');
      else if (currentFilter === 'none') dataTampil = dataTampil.filter(d => d.status === 'none');
      else if (currentFilter === 'umum') dataTampil = dataTampil.filter(d => d.jenis === 'Umum');
      else if (currentFilter === 'salikin') dataTampil = dataTampil.filter(d => d.jenis === 'Salikin' || d.jenis === 'Salikah');

      if (jenis === 'SalikinSalikah') dataTampil = dataTampil.filter(d => d.jenis === 'Salikin' || d.jenis === 'Salikah');
      else if (jenis) dataTampil = dataTampil.filter(d => d.jenis === jenis);
      if (alamat) dataTampil = dataTampil.filter(d => d.alamat === alamat);

      if (kata) {
        dataTampil = dataTampil.filter(d =>
          (d.nama || "").toLowerCase().includes(kata)
        );
      }

      renderTable(dataTampil);
    }

  </script>
